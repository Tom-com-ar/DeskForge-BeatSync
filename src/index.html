<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101319" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' http://127.0.0.1:5174 ws://127.0.0.1:5174" />
    <title>DeskForge + BeatSync</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div class="brand-icon" aria-hidden="true">D</div>
        <div>
          <h1>DeskForge <span>+</span> BeatSync</h1>
          <p>Suite de productividad</p>
        </div>
      </header>

      <main>
        <div class="status"><span></span> Aplicación activa</div>
        <h2>Todo listo para empezar.</h2>
        <p class="intro">Vamos a construir tu espacio de trabajo paso a paso.</p>

        <section class="requirement" aria-label="Punto E1 completado">
          <span class="point-id">E1</span>
          <div class="requirement-copy">
            <strong>Ventana principal</strong>
            <span>Menú nativo y bandeja del sistema</span>
          </div>
          <span class="complete">Activo</span>
        </section>
      </main>

      <footer>La ventana se oculta al cerrarla. Podés volver desde el ícono de la bandeja.</footer>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
